<title>揪團日曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: pine "band" header holding title + member pills; below it a wizard (step card left, live calendar right on desktop; stacked with floating nav on phone). Cards float on a warm paper ground with soft shadows, controls are pills. */
:root{
  --bg:#f4f1ea; --paper:#fbf9f4; --surface:#ffffff; --sunk:#efebe2; --ink:#16241f; --muted:#6f7a72; --line:#e3ddd1;
  --band:#17322a; --band-ink:#f4f1ea; --band-soft:rgba(244,241,234,.12); --band-muted:rgba(244,241,234,.66);
  --accent:#17322a; --accent-ink:#ffffff; --cta:#ee6a45; --cta-ink:#ffffff;
  --ok:#2f7d5b; --on-ok:#ffffff; --ok-bg:#dcefe3; --no:#c4523d; --no-bg:#f7e2dc;
  --hol:#c4523d; --hol-bg:#fbe9e4; --fest:#a8741a; --fest-bg:#f8edd3;
  --sun:#c4523d; --sat:#3b66b0;
  --p1:#3b66b0; --p2:#1f8a86; --p3:#7d4fb0; --p4:#c7742a;
  --shadow:0 1px 2px rgba(23,50,42,.05),0 10px 30px rgba(23,50,42,.07);
  --r:24px;
  --display:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --paper:#131d19; --surface:#18241f; --sunk:#202e28; --ink:#ebefe9; --muted:#9ba69e; --line:#2a3832;
  --band:#0b1210; --band-ink:#ebefe9; --band-soft:rgba(235,239,233,.08); --band-muted:rgba(235,239,233,.6);
  --accent:#9fd4b8; --accent-ink:#0f2a1c; --cta:#f08462; --cta-ink:#1b0d07;
  --ok:#7fcfa3; --on-ok:#0f2a1c; --ok-bg:#1d3a2c; --no:#f08a75; --no-bg:#3a2320;
  --hol:#f08a75; --hol-bg:#3a2420; --fest:#e5b75a; --fest-bg:#3a3020;
  --sun:#f08a75; --sat:#88a9ea; --p1:#88a9ea; --p2:#5fc7c1; --p3:#b993e6; --p4:#eba765;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --paper:#131d19; --surface:#18241f; --sunk:#202e28; --ink:#ebefe9; --muted:#9ba69e; --line:#2a3832;
  --band:#0b1210; --band-ink:#ebefe9; --band-soft:rgba(235,239,233,.08); --band-muted:rgba(235,239,233,.6);
  --accent:#9fd4b8; --accent-ink:#0f2a1c; --cta:#f08462; --cta-ink:#1b0d07;
  --ok:#7fcfa3; --on-ok:#0f2a1c; --ok-bg:#1d3a2c; --no:#f08a75; --no-bg:#3a2320;
  --hol:#f08a75; --hol-bg:#3a2420; --fest:#e5b75a; --fest-bg:#3a3020;
  --sun:#f08a75; --sat:#88a9ea; --p1:#88a9ea; --p2:#5fc7c1; --p3:#b993e6; --p4:#eba765;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--cta);outline-offset:2px}

/* ---------- band ---------- */
.band{background:var(--band);color:var(--band-ink);padding-inline:16px;padding-block:22px 18px}
.band-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--cta);font-weight:700}
header h1{font-family:var(--display);font-size:clamp(28px,5.4vw,42px);margin:0;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
header p{margin:0;color:var(--band-muted);font-size:14px}
.toprow{display:flex;align-items:flex-start;gap:12px}
.toprow header{flex:1;min-width:0}
.toprow .adminbtn+.adminbtn{margin-left:-4px}
a.adminbtn{text-decoration:none}
.adminbtn{flex:none;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px 7px 9px;background:var(--band-soft);color:var(--band-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.adminbtn svg{width:18px;height:18px}
.adminbtn.on{background:var(--cta);color:var(--cta-ink)}
.alist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea{font:inherit;font-size:15px;font-weight:400;color:var(--ink);padding:9px 12px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);width:100%}
.fld textarea{resize:vertical;font-variant-numeric:tabular-nums;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ok)}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.arow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;border-radius:16px;background:var(--paper)}
.arow .av{width:32px;height:32px}
.arow b{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow small{color:var(--muted);font-size:12px;white-space:nowrap}
.arow .del{border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;background:var(--no-bg);color:var(--no);cursor:pointer}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addrow input{flex:1;min-width:140px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.people{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.people::-webkit-scrollbar{display:none}
.pbtn{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border:0;border-radius:999px;background:var(--band-soft);color:var(--band-ink);font:inherit;cursor:pointer;text-align:left;transition:background .15s}
.pbtn:hover{background:rgba(244,241,234,.2)}
.pbtn[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
.av{width:36px;height:36px;border-radius:50%;display:block;overflow:hidden;flex:none;position:relative}
.av svg{display:block;width:100%;height:100%}
.pbtn .av{width:40px;height:40px}
.pmeta{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pname{font-weight:700;font-size:14px;white-space:nowrap}
.pstat{font-size:11px;opacity:.7;display:flex;align-items:center;gap:3px}
.pstat svg{width:11px;height:11px}
.pbtn.all .av{background:var(--cta);color:var(--cta-ink)}
.av.grp{color:#fff}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--fest-bg);color:var(--fest);border-radius:14px;padding:10px 14px;font-size:13px}
.panel{display:flex;flex-direction:column;gap:18px}
.hint{font-size:13px;color:var(--muted);margin:0}
.linkbtn{border:0;background:none;color:var(--ok);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* ---------- buttons ---------- */
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;border:0;background:var(--sunk);color:var(--ink);cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--cta);color:var(--cta-ink);box-shadow:0 6px 16px rgba(238,106,69,.28)}
.btn.danger{background:none;color:var(--no);box-shadow:inset 0 0 0 1.5px var(--no)}
.btn.big{padding:13px 22px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- wizard ---------- */
.wizbar{margin-bottom:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4}
.wz{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;padding:8px 4px;border-radius:999px;min-width:0;transition:background .2s,color .2s}
.wz .wn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sunk);flex:none}
.wz .wt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz.done{color:var(--ok)}.wz.done .wn{background:var(--ok);color:var(--on-ok)}
.wz.cur{background:var(--band);color:var(--band-ink)}.wz.cur .wn{background:var(--cta);color:var(--cta-ink)}
.me{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:980px){.me{grid-template-columns:440px minmax(0,1fr)}.stepcard{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));max-height:calc(100vh - 86px);overflow:auto}}
.stepcard{background:var(--surface);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.whohead{display:flex;align-items:flex-start;gap:12px}
.whohead .av{width:44px;height:44px;font-size:17px;box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--sunk)}
.whohead .eyebrow{color:var(--muted)}
.stepcard h2{font-family:var(--display);font-size:clamp(23px,4.6vw,30px);margin:2px 0 0;line-height:1.25;text-wrap:balance}
.lead{margin:0;font-size:15px;color:var(--ink);opacity:.85}
.note{background:var(--fest-bg);color:var(--fest);border-radius:14px;padding:10px 14px;font-size:13px}
.subhead{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tips li{background:var(--paper);border-radius:14px;padding:10px 14px}
.wiznav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wiznav .btn.pri{flex:1;max-width:300px;padding:13px 20px;font-size:15px}

/* tally bar */
.tbar{display:flex;flex-direction:column;gap:8px}
.tbar .track{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.tbar .track i{display:block;height:100%}
.tbar .keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.tbar .keys span{display:flex;align-items:center;gap:5px}
.tbar .keys b{color:var(--ink);font-variant-numeric:tabular-nums}
.k-filled{background:var(--ok)}.k-ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1.5px var(--ok)}.k-no{background:var(--no)}.k-na{background:var(--line)}
.tbar .keys i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* rules & segmented pills */
.rule{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--paper)}
.rule .lbl{display:flex;flex-direction:column;min-width:0;flex:1;font-weight:700;font-size:14px}
.rule .lbl small{color:var(--muted);font-size:12px;font-weight:400}
.rule.sm{padding-block:6px}
.seg{display:flex;gap:2px;flex:none;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok);color:var(--on-ok)}
.seg button[data-v="no"][aria-pressed="true"]{background:var(--no);color:#fff}
.seg button[data-v="clr"]{font-weight:500;font-size:12px}
.seg button:disabled{opacity:.3;cursor:default}
details.more{border-radius:18px;background:var(--paper);padding:2px 6px 8px}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;padding:10px;color:var(--ok);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
details.more .rule,details.more .trow{background:var(--surface);margin-top:6px}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--sunk);border-radius:999px;padding:4px}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:22px;padding:4px}
.modesw button{font:inherit;border:0;background:none;border-radius:18px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.modesw button b{font-size:15px}
.modesw button small{font-size:12px}
.modesw button[aria-checked="true"]{background:var(--band);color:var(--band-ink)}
.modesw button[aria-checked="true"] small{color:var(--band-muted)}
.mseg.off{opacity:.35}
.mseg.off button{cursor:not-allowed}
.mseg.four{grid-template-columns:repeat(4,1fr)}
.mseg button{font:inherit;font-weight:700;padding:10px 0;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.mseg button[data-v="ok"][aria-pressed="true"]{background:var(--ok);color:var(--on-ok)}
.mseg button[data-v="no"][aria-pressed="true"]{background:var(--no);color:#fff}
.mseg button[data-v="na"][aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mseg button[data-v=""][aria-pressed="true"]{background:var(--band);color:var(--band-ink)}

/* time rows */
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l b" "t t";gap:10px;align-items:center;padding:14px 14px 14px 16px;border-radius:18px;background:var(--paper)}
.trow.main{background:var(--ok-bg)}
.trow.tbx{grid-template-areas:"l b" "t t"}
.trow .nt{grid-area:b;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok);cursor:pointer;white-space:nowrap}
.trow .nt input{width:18px;height:18px;accent-color:var(--ok)}
.trow.notime{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ok)}
.sumcard{display:flex;flex-direction:column;gap:8px}
.sl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border-radius:18px;background:var(--paper);font-size:14px}
.sl .tag{font-size:12px;font-weight:700;padding:3px 0;border-radius:999px;text-align:center}
.sl>div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.sl .rr{font-weight:700}.sl .dl{color:var(--ink);opacity:.8;width:100%}.sl .plus{color:var(--muted);font-size:13px}
.sl em{font-style:normal;font-size:12px;color:var(--muted)}
.sl .none{color:var(--muted)}.sl .warn{width:100%;color:var(--fest);font-size:13px}
.s-ok{background:var(--ok-bg)}.s-ok .tag{background:var(--ok);color:var(--on-ok)}
.s-tm .tag{background:var(--band);color:var(--band-ink)}
.s-no{background:var(--no-bg)}.s-no .tag{background:var(--no);color:#fff}
.s-na .tag{background:var(--line);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{font:inherit;display:flex;align-items:center;gap:10px;text-align:left;border:0;cursor:pointer;padding:12px;border-radius:20px;background:var(--paper);color:var(--ink);transition:transform .12s}
.act:active{transform:scale(.97)}
.act svg{width:40px;height:40px;flex:none}
.act span{display:flex;flex-direction:column;min-width:0}
.act b{font-size:14px}.act small{font-size:12px;color:var(--muted)}
.act.main{grid-column:1/-1;background:var(--cta);color:var(--cta-ink);padding:14px 16px;box-shadow:0 8px 20px rgba(238,106,69,.28)}
.act.main svg{width:52px;height:52px;background:rgba(255,255,255,.18);border-radius:16px;padding:4px}
.act.main b{font-size:17px}.act.main small{color:var(--cta-ink);opacity:.85}
.act.warn b{color:var(--no)}
.bigic svg{width:56px;height:56px}
details.nofold{border-radius:18px;background:var(--no-bg);color:var(--no)}
details.nofold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:700;font-size:14px}
details.nofold summary::-webkit-details-marker{display:none}
details.nofold summary::after{content:"＋";margin-left:auto;font-weight:700}
details.nofold[open] summary::after{content:"－"}
details.nofold summary small{font-weight:400;font-size:12px;opacity:.85}
details.nofold .trow{margin:0 6px 6px;background:var(--surface);color:var(--ink)}
details.more details.nofold{margin-top:6px}
.trow .lbl{grid-area:l;display:flex;flex-direction:column;font-weight:700;font-size:14px}
.trow .lbl small{color:var(--muted);font-weight:400;font-size:12px}
.trow .tt{grid-area:t;display:flex;align-items:center;gap:8px}
.trow .btn{grid-area:b;padding:8px 14px;font-size:13px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.trow .btn.pri{background:var(--cta);box-shadow:0 6px 16px rgba(238,106,69,.25)}
.times{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t24{display:flex;align-items:center;gap:2px;flex:1;min-width:0;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);padding:2px 6px}
.t24:focus-within{box-shadow:inset 0 0 0 2px var(--ok)}
.t24 select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;padding:7px 2px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer}
.t24 select:focus{outline:none}
.t24 b{color:var(--muted)}
input[type="time"],.modal input{font:inherit;font-variant-numeric:tabular-nums;padding:9px 12px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1}
input[type="time"]:focus,.modal input:focus{box-shadow:inset 0 0 0 2px var(--ok);outline:none}

/* ---------- calendar ---------- */
.calhead{display:flex;flex-direction:column;gap:12px;min-width:0}
.tapcall{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.tapcall.live{background:var(--band);color:var(--band-ink)}
.tapcall.live small{color:var(--band-muted)}
.tapcall svg{width:30px;height:30px;flex:none;color:var(--cta)}
.tapcall b{display:block;font-size:15px}
.tapcall small{color:var(--muted);font-size:13px}
.tapcall .btn{margin-left:auto;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.month{background:var(--surface);border-radius:var(--r);padding:16px 12px 12px;box-shadow:var(--shadow);container-type:inline-size}
.month h3{font-family:var(--display);font-size:26px;margin:0 6px 10px;display:flex;align-items:baseline;gap:8px;line-height:1}
.month h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,1.2cqw,6px)}
.wd{text-align:center;font-size:clamp(11px,3cqw,13px);color:var(--muted);padding-bottom:4px;font-weight:700}
.wd.s0{color:var(--sun)}.wd.s6{color:var(--sat)}
.day{position:relative;aspect-ratio:1/1;overflow:hidden;min-height:0;width:100%;border-radius:clamp(10px,3.4cqw,16px);border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(0px,.6cqw,3px);padding:0;min-width:0;font-variant-numeric:tabular-nums;transition:transform .12s,background .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.day .n{font-size:clamp(14px,4.8cqw,21px);font-weight:700;line-height:1}

/* ---------- 活動設定（管理員可在網頁上修改） ---------- */
let CFG={title:"揪團日曆",subtitle:"每個人標好自己的空檔，系統自動找出大家都能約的日子。",start:"2026-11",end:"2027-03",time:{from:"10:30",to:"16:30"},holidays:{...HOL},festivals:{...FEST}};

  2027:{"2027-01-01":"元旦","2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-06":"初一","2027-02-07":"初二","2027-02-08":"初三","2027-02-09":"補假","2027-02-10":"補假","2027-02-28":"228","2027-03-01":"補假","2027-04-04":"兒童節","2027-04-05":"清明","2027-04-06":"補假","2027-04-30":"補假","2027-05-01":"勞動節","2027-06-09":"端午","2027-09-15":"中秋","2027-09-28":"教師節","2027-10-10":"國慶","2027-10-11":"補假","2027-10-25":"光復節"}};
function monthsBetween(a,b){const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);const out=[];let y=ya,m=ma;
  while((y<yb||(y===yb&&m<=mb))&&out.length<24){out.push([y,m]);m++;if(m>12){m=1;y++}}return out.length?out:[[ya,ma]]}

const WD=["日","一","二","三","四","五","六"];
const TIMES=[];for(let h=0;h<=24;h++)for(const m of[0,30]){if(h===24&&m)break;TIMES.push(String(h).padStart(2,"0")+":"+(m?"30":"00"))}

  return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15.5" r="7.2" fill="rgba(255,255,255,.92)"/><path d="M6.5 41c.9-9.6 6.4-14.6 13.5-14.6S32.6 31.4 33.5 41z" fill="rgba(255,255,255,.92)"/></svg>`}

function fmt(k){const[y,m,d]=k.split("-").map(Number);return `${m}/${d}（${WD[new Date(y,m-1,d).getDay()]}）`}

function blankRules(){return{weekday:"",offday:"",holiday:"",dow:["","","","","","",""]}}
function blank(){return{setup:true,pw:null,brush:"ok",dates:{},dayTimes:{},rules:blankRules(),time:{...CFG.time}}}
function norm(p){if(!p)return p;const r=p.rules||{};
  if(!Array.isArray(r.dow)||r.dow.length!==7||typeof r.weekday==="boolean"||typeof r.holiday==="boolean"){
    const n=blankRules();
    if(r.holiday===true)n.holiday="no";if(r.weekend===true)n.offday="no";if(r.weekday===true)n.weekday="no";
    if(Array.isArray(r.dow))r.dow.forEach(d=>{if(typeof d==="number")n.dow[d]="no"});
    p.rules=n}
  p.dates=p.dates||{};for(const k in p.dates){if(!["ok","no","na"].includes(p.dates[k]))p.dates[k]=p.mode==="ok"?"ok":"no"}
  p.dayTimes=p.dayTimes||{};p.time=p.time||{...CFG.time};p.brush=["ok","no","na"].includes(p.brush)?p.brush:"ok";p.catTime=p.catTime||{};return p}

/* 優先順序：手動設定 > 國定假日 > 星期幾 > 平日／假日 > 未填 */
/* 套用到這天的規則中，最後設定的那條優先（沒有時間記錄時：國定假日 > 星期幾 > 平日／假日） */
function ruleFor(p,k,dow){const r=p.rules||blankRules(),ts=p.ruleTs||{},c=[];
  const off=dow===0||dow===6||!!HOL[k];
  if(HOL[k]&&r.holiday)c.push(["holiday",r.holiday,3]);
  if(r.dow&&r.dow[dow])c.push(["dow"+dow,r.dow[dow],2]);
  if(off&&r.offday)c.push(["offday",r.offday,1]);
  if(!off&&r.weekday)c.push(["weekday",r.weekday,1]);
  if(!c.length)return null;
  c.sort((a,b)=>b[2]-a[2]);/* 越具體越優先：國定假日 > 星期幾 > 平日／假日 */
  return c[0][1]}
function dowOf(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getDay()}

  const o=p.dates&&p.dates[k];if(o==="ok"||o==="no"||o==="na")return o;

function state(p,k,dow){const s=status(p,k,dow);return s==="ok"&&p.dayTimes&&p.dayTimes[k]?"filled":s}
function timeFor(p,k){return (p&&p.dayTimes&&p.dayTimes[k])||null}

function dayOverlap(k,dow){const f=PEOPLE.map(x=>S.people[x.id]).filter(q=>q&&status(q,k,dow)==="ok"&&timeFor(q,k));if(!f.length)return null;
  const from=f.map(q=>timeFor(q,k).from).sort().pop(),to=f.map(q=>timeFor(q,k).to).sort()[0];return{from,to,ok:from<to,n:f.length}}

async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tc4:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "tc4:"+s)h=(h*33+c.charCodeAt(0))>>>0;return "h"+h}}

/* ---------- storage ---------- */
const timers={},chains={},pending={};
function persist(id){
  pending[id]=true;clearTimeout(timers[id]);
  const me=timers[id]=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S.people[id]));body.updatedAt=Date.now();
    chains[id]=(chains[id]||Promise.resolve()).then(async()=>{
      if(S.api){try{const r=await fetch("/api/people/"+id,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw 0}catch(e){toast("儲存失敗，請檢查網路後再試")}}

}

function renderPeople(){

function stashTime(p,k){if(p.dayTimes[k]){p.memTimes=p.memTimes||{};p.memTimes[k]=p.dayTimes[k];delete p.dayTimes[k]}}
function restoreTime(p,k,fallback){if(p.dayTimes[k])return;const m=p.memTimes&&p.memTimes[k];const t=m||fallback;if(t)p.dayTimes[k]={from:t.from,to:t.to};if(m)delete p.memTimes[k]}
function setDay(p,k,v){const rule=ruleFor(p,k,dowOf(k))||"na";
  if(v==="ok"){if(!p.brushNoTime)restoreTime(p,k,p.brushTime||p.time)}else stashTime(p,k);
  if(v===rule)delete p.dates[k];else p.dates[k]=v}
function setRule(p,f,v){if(f.startsWith("dow"))p.rules.dow[+f.slice(3)]=v;else p.rules[f]=v;
  p.ruleTs=p.ruleTs||{};if(v)p.ruleTs[f]=Date.now();else delete p.ruleTs[f];
  let n=0,cleared=0;eachDay((k,dow)=>{if(!inCat(f,k,dow))return;n++;if(p.dates[k]){delete p.dates[k];cleared++}const st=status(p,k,dow);if(st==="ok")restoreTime(p,k,p.catTime&&p.catTime[f]);else stashTime(p,k)});
  persist(S.sel);render();
  let got=0;eachDay((k,dow)=>{if(inCat(f,k,dow)&&status(p,k,dow)===v)got++});
  toast(v?`${catLabel(f)}：${got} 天設成「${STL[v]}」${got<n?`（另外 ${n-got} 天有更具體的規則）`:""}`:`${catLabel(f)} 的規則已取消`)}
function applyCatTime(p,cat,f,to){if(!f||!to||f>=to){toast("結束時間要晚於開始時間");return false}

mainEl.addEventListener("contextmenu",e=>{const d=e.target.closest(".day");if(!d||S.view!=="me")return;e.preventDefault();if(S.multi)return;
  if(suppress||document.getElementById("modal").hidden===false)return;endPress();suppress=e.pointerType==="touch";dayDialog(d.dataset.k)});

/* ---------- events ---------- */
document.getElementById("people").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b||!S.ready)return;
  if(b.dataset.p==="__all"){S.view="all";render();window.scrollTo(0,0)}else openPerson(b.dataset.p)});
document.addEventListener("click",e=>{
  const t=e.target;if(!t.closest("#main"))return;
  if(S.view==="me"){const id=S.sel,p=S.people[id];if(!p)return;
    const day=t.closest(".day");if(day){if(suppress){suppress=false;return}const k=day.dataset.k;
      if(S.multi){S.selDays.has(k)?S.selDays.delete(k):S.selDays.add(k);render();return}
      const cur=status(p,k,dowOf(k));setDay(p,k,cur==="ok"?"no":cur==="no"?"na":"ok");S.focusDay=k;
      persist(id);render();return}
    const fs=t.closest("[data-fset]");if(fs){if(S.focusDay){setDay(p,S.focusDay,fs.dataset.fset);persist(id);render()}return}
    const rb=t.closest("[data-rule]");if(rb){setRule(p,rb.dataset.rule,rb.dataset.v==="clr"?"":rb.dataset.v);return}
    const cy=t.closest("[data-cyc]");if(cy){const f=cy.dataset.cyc,cur=f.startsWith("dow")?p.rules.dow[+f.slice(3)]:p.rules[f];setRule(p,f,cur===""||!cur?"ok":cur==="ok"?"no":"");return}
    const ck=t.closest("[data-clk]");if(ck)return catTimeDialog(ck.dataset.clk);
    const bk=t.closest("[data-bulk]");if(bk){const a=bk.dataset.bulk;
      if(a==="time")return bulkTimeDialog();
      if(a==="none"){S.selDays.clear();render();return}
      const n=S.selDays.size;for(const k of S.selDays){p.dates[k]=a;if(a!=="ok")stashTime(p,k);else restoreTime(p,k,null)}S.selDays.clear();persist(id);render();toast(`已把 ${n} 天設成「${STL[a]}」`);return}
    const sc=t.closest("[data-selcat]");if(sc){const cat=sc.dataset.selcat,ks=[];eachDay((k,dow)=>{if(cat==="all"?status(p,k,dow)==="ok":inCat(cat,k,dow))ks.push(k)});
      const allIn=ks.length&&ks.every(k=>S.selDays.has(k));ks.forEach(k=>allIn?S.selDays.delete(k):S.selDays.add(k));render();return}
    const sp=t.closest("[data-step]");if(sp){S.step=+sp.dataset.step;if(S.step!==3){S.multi=false;S.selDays.clear()}render();
      const sc2=document.querySelector(".stepcard");if(sc2&&sc2.getBoundingClientRect().top<0)sc2.scrollIntoView({block:"start"});return}
    const ap=t.closest("[data-apply]");if(ap){const cat=ap.dataset.apply;applyCatTime(p,cat,document.getElementById("ct-from-"+cat).value,document.getElementById("ct-to-"+cat).value);return}
    const b=t.closest("button");if(!b)return;
    if(b.id==="goAll"){S.view="all";render();return}
    if(b.id==="multiBtn"){S.multi=!S.multi;S.selDays.clear();render();return}
    if(b.dataset.mode){const m=b.dataset.mode==="multi";if(m!==S.multi){S.multi=m;S.selDays.clear();render()}return}
    if(b.id==="fillEmpty"||b.id==="fillAll"){if(p.time.from>=p.time.to){toast("結束時間要晚於開始時間");return}let n=0;
      eachDay((k,dow)=>{if(status(p,k,dow)==="ok"&&(b.id==="fillAll"||!p.dayTimes[k])){p.dayTimes[k]={...p.time};n++}});
      persist(id);render();toast(`已填入 ${n} 天的時段`);return}
    if(b.id==="rulesReset"){p.rules=blankRules();p.ruleTs={};persist(id);render();toast("規則已全部重置");return}
    if(b.id==="resetBtn")return resetDialog();
    if(b.id==="pwBtn")return pwDialog();
    if(b.id==="clearBtn"){p.dates={};p.dayTimes={};persist(id);render();toast("已清除");return}
  }else{const sb=t.closest("[data-start]");if(sb)return openPerson(sb.dataset.start);
    const c=t.closest("[data-k]");if(c){S.picked=S.picked===c.dataset.k?null:c.dataset.k;render()}}
});
document.getElementById("main").addEventListener("change",e=>{const p=S.people[S.sel];if(!p||S.view!=="me")return;const ct=e.target.dataset&&e.target.dataset.ct;
  if(e.target.id==="noTime"){const on=e.target.checked,fk=S.focusDay;
    if(fk&&status(p,fk,dowOf(fk))==="ok"){if(on)stashTime(p,fk);else restoreTime(p,fk,p.brushTime||p.time)}
    else p.brushNoTime=on;
    if(fk)p.brushNoTime=on;persist(S.sel);render();return}
  const bt=e.target.dataset&&e.target.dataset.bt;
  if(bt&&e.target.value){const fk=S.focusDay,base=(fk&&p.dayTimes[fk])||p.brushTime||p.time,nt=Object.assign({},base,{[bt]:e.target.value});
    if(nt.from>=nt.to){toast("結束時間要晚於開始時間");return}
    p.brushTime=nt;if(fk&&status(p,fk,dowOf(fk))==="ok")p.dayTimes[fk]={from:nt.from,to:nt.to};persist(S.sel);render();return}
  if(ct&&e.target.value){p.catTime=p.catTime||{};p.catTime[ct]=Object.assign({},p.catTime[ct]||p.time,{[e.target.dataset.f]:e.target.value});persist(S.sel)}});

const COLORS=["#1f8a86","#3b66b0","#7d4fb0","#c7742a","#c4523d","#2f7d5b","#b0477f","#6b7a2f","#4a5a8a","#a0622d"];
const DEFAULT_ROSTER=PEOPLE.map(p=>({id:p.id,name:p.name,c:p.c}));
function applyRoster(list){if(!Array.isArray(list))return;PEOPLE=list.map(x=>({id:String(x.id),name:String(x.name||"").slice(0,20)||"成員",c:x.c||COLORS[0]}));
  if(S.sel&&!PEOPLE.some(p=>p.id===S.sel)){S.view="all";S.sel=null}}
let adminPass=null;try{adminPass=sessionStorage.getItem("tc4admin")}catch(e){}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const LOCAL_ADMIN_HASH="9cc0a05dc5ce81095fe874ba93e784c363f0e480e55eba211ed892848e8fcef5";
async function checkAdmin(pw){if(S.api){const r=await fetch("/api/admin/check",{method:"POST",headers:{"x-admin-pass":pw}});return r.ok}
  return (await sha("tc4admin:"+pw))===LOCAL_ADMIN_HASH}
async function saveRoster(list){
  if(S.api){const r=await fetch("/api/roster",{method:"PUT",headers:{"content-type":"application/json","x-admin-pass":adminPass||""},body:JSON.stringify(list)});if(!r.ok)throw new Error("roster "+r.status)}
  else if(S.db){await S.db.collection("meta").doc("roster").set({list})}
  else{try{localStorage.setItem("tc4roster",JSON.stringify(list))}catch(e){}}
  applyRoster(list);render()}
async function removePerson(id){
  if(S.api){const r=await fetch("/api/people/"+id,{method:"DELETE",headers:{"x-admin-pass":adminPass||""}});if(!r.ok)throw 0}
  else if(S.db){await S.db.collection("people").doc(id).delete()}
  else{try{localStorage.removeItem("tc4:"+id)}catch(e){}}
  delete S.people[id]}
function renderAdminBtn(){const b=document.getElementById("adminBtn");b.classList.toggle("on",!!adminPass);b.querySelector("span").textContent=adminPass?"管理中":"管理"}
async function adminConfigured(){if(!S.api)return true;try{const r=await fetch("/api/admin/status",{cache:"no-store"});if(r.ok)return !!(await r.json()).configured}catch(e){}return true}
async function adminLogin(){
  if(!(await adminConfigured())){modal(`<div class="bigic">${IC.lock}</div><h2>還沒設定管理員密碼</h2><p class="hint">部署時沒有填 ADMIN_PASSWORD。請到 Cloudflare 後台 → 這個 Worker → 設定 → 「變數和密碼」新增一個密碼類型的 <b>ADMIN_PASSWORD</b>，儲存後回來重新整理就能登入。</p><div class="row"><button class="btn pri" id="ok">知道了</button></div>`,m=>{m.querySelector("#ok").onclick=closeModal});return}
  modal(`<div class="bigic">${IC.lock}</div><h2>管理員登入</h2><p class="hint">登入後可以新增或刪除成員。</p>
    <input id="apw" type="password" inputmode="numeric" placeholder="管理員密碼" autocomplete="current-password"><p class="err" id="e"></p>
    <div class="row"><button class="btn" id="c">取消</button><button class="btn pri" id="ok">登入</button></div>`,m=>{
    m.querySelector("#c").onclick=closeModal;
    const go=async()=>{const v=m.querySelector("#apw").value;if(!v)return;
      let ok=false;try{ok=await checkAdmin(v)}catch(e){}
      if(!ok){m.querySelector("#e").textContent="密碼不對";return}
      adminPass=v;try{sessionStorage.setItem("tc4admin",v)}catch(e){}renderAdminBtn();adminPanel()};
    m.querySelector("#ok").onclick=go;m.querySelector("#apw").onkeydown=e=>{if(e.key==="Enter")go()}})}
function holToText(o){return Object.keys(o||{}).sort().map(k=>k+" "+o[k]).join("\n")}
function textToHol(t){const o={},bad=[];t.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const m=line.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\s*(.*)$/);
  if(!m){bad.push(line);return}const k=`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;const d=new Date(k+"T00:00:00");if(isNaN(d)||d.getMonth()+1!==+m[2]){bad.push(line);return}o[k]=(m[4]||"假日").slice(0,6)});return{o,bad}}
async function saveConfig(c){
  if(S.api){const r=await fetch("/api/config",{method:"PUT",headers:{"content-type":"application/json","x-admin-pass":adminPass||""},body:JSON.stringify(c)});if(!r.ok)throw new Error("config "+r.status)}
  else if(S.db){await S.db.doc("meta/config").set(c)}
  else{try{localStorage.setItem("tc4config",JSON.stringify(c))}catch(e){}}
  applyConfig(c);render()}
function configDialog(){const c=CFG;
  modal(`<h2>活動設定</h2><p class="hint">改完按儲存，所有人重新整理後就會看到。已經填好的資料不會被刪掉。</p>
    <label class="fld"><span>活動名稱</span><input id="cTitle" maxlength="30" value="${esc(c.title)}"></label>
    <label class="fld"><span>一句話說明</span><input id="cSub" maxlength="60" value="${esc(c.subtitle)}"></label>
    <div class="fld2"><label class="fld"><span>從哪個月</span><input id="cStart" type="month" value="${c.start}"></label><label class="fld"><span>到哪個月</span><input id="cEnd" type="month" value="${c.end}"></label></div>
    <div class="fld"><span>預設可以的時段（新成員和「點成可以」會帶入）</span><div class="times">${tIn("cFrom",c.time.from)}<span>–</span>${tIn("cTo",c.time.to)}</div></div>
    <label class="fld"><span>放假日（一行一天：日期 名稱）</span><textarea id="cHol" rows="6" placeholder="2027-02-05 除夕">${esc(holToText(c.holidays))}</textarea></label>
    <div class="row" style="justify-content:flex-start;gap:6px">${Object.keys(TW_HOLIDAYS).map(y=>`<button class="btn" data-preset="${y}" style="padding:7px 12px;font-size:13px">＋ 台灣 ${y} 國定假日</button>`).join("")}<button class="btn" id="clrHol" style="padding:7px 12px;font-size:13px">清空</button></div>
    <label class="fld"><span>不放假的節日（只做標示）</span><textarea id="cFest" rows="3" placeholder="2027-02-20 元宵">${esc(holToText(c.festivals))}</textarea></label>
    <p class="err" id="e"></p>
    <div class="row"><button class="btn" id="back">回到成員</button><button class="btn pri" id="save">儲存設定</button></div>`,m=>{
    m.querySelector("#back").onclick=adminPanel;
    m.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{const ta=m.querySelector("#cHol"),cur=textToHol(ta.value).o;Object.assign(cur,TW_HOLIDAYS[b.dataset.preset]);ta.value=holToText(cur)});
    m.querySelector("#clrHol").onclick=()=>{m.querySelector("#cHol").value=""};
    m.querySelector("#save").onclick=async()=>{const e=m.querySelector("#e"),v=id=>m.querySelector(id).value.trim();e.textContent="";
      const st=v("#cStart"),en=v("#cEnd"),f=v("#cFrom"),t=v("#cTo");
      if(!v("#cTitle")){e.textContent="請填活動名稱";return}
      if(!/^\d{4}-\d{2}$/.test(st)||!/^\d{4}-\d{2}$/.test(en)||st>en){e.textContent="日期範圍不對：開始月份要早於結束月份";return}
      if(monthsBetween(st,en).length>=24&&en>st){e.textContent="日期範圍最多 24 個月";return}
      if(!f||!t||f>=t){e.textContent="預設時段：結束時間要晚於開始時間";return}
      const h=textToHol(m.querySelector("#cHol").value),fe=textToHol(m.querySelector("#cFest").value);
      if(h.bad.length||fe.bad.length){e.textContent="這幾行看不懂，請用「2027-02-05 除夕」的格式："+h.bad.concat(fe.bad).slice(0,3).join("、");return}
      const nc={title:v("#cTitle"),subtitle:v("#cSub"),start:st,end:en,time:{from:f,to:t},holidays:h.o,festivals:fe.o};
      try{await saveConfig(nc);toast("活動設定已儲存");adminPanel()}catch(err){e.textContent="儲存失敗，請重新登入管理員再試"}}})}
function adminPanel(){let color=COLORS.find(c=>!PEOPLE.some(p=>p.c===c))||COLORS[PEOPLE.length%COLORS.length];
  modal(`<h2>管理成員</h2><p class="hint">目前 ${PEOPLE.length} 人。刪除成員會一起刪掉他填的資料。</p>
    <div class="alist">${PEOPLE.map(p=>`<div class="arow"><span class="av" style="background:${p.c}">${faceSVG(p.id)}</span><b>${esc(p.name)}</b><small>${!S.people[p.id]?"還沒填":S.people[p.id].prefill?"管理員預填":"已填寫"}</small><button class="del" data-fillfor="${p.id}" style="background:var(--ok-bg);color:var(--ok)">代填</button><button class="del" data-del="${p.id}"${PEOPLE.length<=1?" disabled":""}>刪除</button></div>`).join("")}</div>
    <p class="hint" style="margin-top:4px"><b>新增成員</b></p>

    m.querySelector("#logout").onclick=()=>{adminPass=null;if(S.view==="me"&&S.sel&&(S.people[S.sel]?.pw&&!unlocked.has(S.sel)||S.people[S.sel]?.prefill)){S.view="all";S.sel=null;render()}try{sessionStorage.removeItem("tc4admin")}catch(e){}renderAdminBtn();closeModal();toast("已登出管理員")};
    const add=async()=>{const n=m.querySelector("#nn").value.trim();if(!n){m.querySelector("#e").textContent="請輸入名字";return}
      if(PEOPLE.some(p=>p.name===n)){m.querySelector("#e").textContent="已經有這個名字了";return}
      if(PEOPLE.length>=20){m.querySelector("#e").textContent="最多 20 人";return}
      const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      try{await saveRoster(PEOPLE.map(p=>({id:p.id,name:p.name,c:p.c})).concat([{id,name:n,c:color}]));toast(`已新增 ${n}`);adminPanel()}
      catch(e){m.querySelector("#e").textContent="新增失敗，請重新登入管理員再試"}};
    m.querySelector("#add").onclick=add;m.querySelector("#nn").onkeydown=e=>{if(e.key==="Enter")add()};
    m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const P=PEOPLE.find(x=>x.id===b.dataset.del);
      modal(`<div class="bigic">${IC.reset}</div><h2>確定刪除 ${esc(P.name)}？</h2><p class="hint">會把 ${esc(P.name)} 從名單移除，他填的日期、時段和密碼也會一起刪掉，沒辦法復原。</p>
        <div class="row"><button class="btn" id="c">先不要</button><button class="btn pri" id="ok" style="background:var(--no);box-shadow:none;color:#fff">確定刪除</button></div>`,mm=>{
        mm.querySelector("#c").onclick=adminPanel;
        mm.querySelector("#ok").onclick=async()=>{try{await removePerson(P.id);await saveRoster(PEOPLE.filter(x=>x.id!==P.id).map(p=>({id:p.id,name:p.name,c:p.c})));toast(`已刪除 ${P.name}`);adminPanel()}
          catch(e){mm.querySelector(".hint").textContent="刪除失敗，請重新登入管理員再試"}}})})})}
document.getElementById("adminBtn").addEventListener("click",()=>adminPass?adminPanel():adminLogin());

render();
/* 放在 Cloudflare 上時：資料存在 D1，透過 /api/people 讀寫，每幾秒同步一次 */
let lastRemote="";
async function pullApi(){
  const r=await fetch("/api/people",{cache:"no-store"});if(!r.ok)throw new Error("api "+r.status);
  const all=await r.json();try{const rc=await fetch("/api/config",{cache:"no-store"});if(rc.ok){const cf=await rc.json();if(JSON.stringify(cf)!==JSON.stringify(S.lastCfg)){S.lastCfg=cf;applyConfig(cf);lastRemote=""}}}catch(e){}try{const rr=await fetch("/api/roster",{cache:"no-store"});if(rr.ok){const rl=await rr.json();if(JSON.stringify(rl)!==JSON.stringify(PEOPLE.map(p=>({id:p.id,name:p.name,c:p.c})))){applyRoster(rl);lastRemote=""}}}catch(e){}
  const txt=JSON.stringify(all);
  if(txt===lastRemote&&S.ready)return;lastRemote=txt;
  const beforeJ=JSON.stringify(S.people);
  for(const id of Object.keys(S.people))if(!all[id]&&!pending[id])delete S.people[id];
  for(const [id,v] of Object.entries(all))if(!pending[id])S.people[id]=norm(v);
  if(S.ready&&JSON.stringify(S.people)===beforeJ)return;
  const a=document.activeElement;if(S.ready&&a&&a.closest&&a.closest("#main, #modal")&&/INPUT|SELECT/.test(a.tagName))return;/* 正在打字時先不重畫 */
  S.ready=true;render()}
(async()=>{
  if(/^https?:$/.test(location.protocol)){
    try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),4000);
      const r=await fetch("/api/people",{cache:"no-store",signal:ctl.signal});clearTimeout(tm);
      if(r.ok&&(r.headers.get("content-type")||"").includes("json")){S.api=true;document.getElementById("guideLink").hidden=false;await pullApi();
        setInterval(()=>{if(!document.hidden)pullApi().catch(()=>{})},4000);
        document.addEventListener("visibilitychange",()=>{if(!document.hidden)pullApi().catch(()=>{})});return}}catch(e){}
  }
  let db=null;
  for(let i=0;i<30&&!window.claude;i++)await new Promise(r=>setTimeout(r,100));
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.local=true;try{applyConfig(JSON.parse(localStorage.getItem("tc4config")||"null"))}catch(e){}try{applyRoster(JSON.parse(localStorage.getItem("tc4roster")||"null"))}catch(e){}loadLocal();S.ready=true;
    const b=document.getElementById("banner");b.textContent="目前連不到共享資料，填的內容只會存在這台裝置上，其他人看不到。";b.hidden=false;render();return}
  S.db=db;
  db.doc("meta/config").onSnapshot(d=>{const v=d.exists&&d.data();if(v){applyConfig(v);render()}},()=>{});
  db.doc("meta/roster").onSnapshot(d=>{const v=d.exists&&d.data();if(v&&v.list){applyRoster(v.list);render()}},()=>{});
  db.collection("people").onSnapshot(snap=>{
    for(const d of snap.docs){if(pending[d.id])continue;const v=d.data();if(v)S.people[d.id]=norm(JSON.parse(JSON.stringify(v)))}
    for(const ch of snap.docChanges())if(ch.type==="removed"&&!pending[ch.doc.id])delete S.people[ch.doc.id];
    S.ready=true;render()},
    err=>{S.ready=true;const b=document.getElementById("banner");b.textContent="共享資料暫時連不上，請重新整理頁面。";b.hidden=false;render()});
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},8000);
})();
</script>
